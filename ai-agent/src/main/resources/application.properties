# ============================================================
#  ai-agent 配置
#  Spring Boot 4.1.1 + Spring AI 2.0.1 + Java 21
# ============================================================
spring.application.name=ai-agent

# ------------------------------------------------------------
#  API Key —— 必须从环境变量注入，切勿硬编码或提交到仓库
#  启动前设置：  set OPENAI_API_KEY=sk-xxx
#  注意：不要写成 spring.ai.openai.api-key=sk-明文，那样 key 会进 git
# ------------------------------------------------------------
spring.ai.openai.api-key=${OPENAI_API_KEY}

# ------------------------------------------------------------
#  OpenAI 兼容端点（当前：DeepSeek）
#  实测 https://api.deepseek.com 与 .../v1 均可用
#  可用模型（2026-09-11 实测）：deepseek-flash、deepseek-v4-pro
# ------------------------------------------------------------
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-flash

# ------------------------------------------------------------
#  模型参数
#  temperature 建议：结构化输出 0~0.3，分析/发散类 0.4~0.8
# ------------------------------------------------------------
spring.ai.openai.chat.options.temperature=0.3

# ------------------------------------------------------------
#  日志：Advisor 调试（官方文档明确要求此包名）
#  看 ChatClient 的请求/响应时打开；生产环境注意敏感信息
# ------------------------------------------------------------
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# 重试/超时的关键路径日志用 INFO 级别输出（重试几次、为什么重试，是排障第一现场）
logging.level.ai.agent.chat=INFO

# ------------------------------------------------------------
#  超时与重试（学习点 9）
#  代码见 ai.agent.config.ChatCallProperties + ai.agent.chat.support.ChatRetryPolicy
#
#  【重要】只有"首个增量到达之前"的失败才会重试：
#  已经吐出内容再重发，用户会看到两段拼接的回答。
#
#  三个超时值必须满足以下大小关系，否则会出现"后端还在重试、前端已报超时"的假故障：
#     后端首字超时(20s) + 各次退避 < 前端首字节超时(30s) < 前端整体超时(180s)
#  前端那两个值在 web/src/api/chat.ts 里改。
# ------------------------------------------------------------

# 最大重试次数（不含首次调用）→ 最坏情况总共 3 次调用
ai.chat.retry.max-attempts=2

# 退避：0.5s → 1s（×2 递增），单次上限 5s；jitter=0.2 表示实际等待在 ±20% 内随机，
# 避免上游恢复瞬间被所有客户端同时重试打挂（重试墙）
ai.chat.retry.initial-backoff=500ms
ai.chat.retry.multiplier=2.0
ai.chat.retry.max-backoff=5s
ai.chat.retry.jitter=0.2

# 只有这些状态码值得重试：429 限流、5xx 服务端临时故障。
# 401/403/404 这类"请求本身有问题"重试多少次都一样，只会掩盖真正的配置错误
ai.chat.retry.retryable-status-codes=429,500,502,503,504

# 首个增量（首字）最长等待：建连 + 模型排队 + 思考时间都算在内。
# 注意首字延迟实测有 3.7s，DeepSeek 高峰期可能到 10s 以上，20s 是留了余量的
ai.chat.timeout.first-token=20s

# 相邻两个增量之间的最大间隔。取 30s 而不是跟首字一样 20s：
# 模型写在长回答中途"想一下"时静默十几秒是正常的，设太小会把正常回答拦腰截断
ai.chat.timeout.idle=30s

# 可观测性：想要 trace 与 token 统计时打开（阶段四）
# management.endpoints.web.exposure.include=health,metrics
management.observations.key-values.application=ai-agent
