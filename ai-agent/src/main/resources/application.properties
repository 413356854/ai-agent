# ============================================================
#  ai-agent 配置
#  Spring Boot 4.1.1 + Spring AI 2.0.1 + Java 21
# ============================================================
spring.application.name=ai-agent

# ------------------------------------------------------------
#  API Key —— 必须从环境变量注入，切勿硬编码或提交到仓库
#  启动前设置：  set OPENAI_API_KEY=sk-xxx
#  注意：不要写成 spring.ai.openai.api-key=sk-明文，那样 key 会进 git
# ------------------------------------------------------------
spring.ai.openai.api-key=${OPENAI_API_KEY}

# ------------------------------------------------------------
#  OpenAI 兼容端点（当前：DeepSeek）
#  实测 https://api.deepseek.com 与 .../v1 均可用
#  可用模型（2026-09-11 实测）：deepseek-flash、deepseek-v4-pro
# ------------------------------------------------------------
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-flash

# ------------------------------------------------------------
#  模型参数
#  temperature 建议：结构化输出 0~0.3，分析/发散类 0.4~0.8
# ------------------------------------------------------------
spring.ai.openai.chat.options.temperature=0.3

# ------------------------------------------------------------
#  日志：Advisor 调试（官方文档明确要求此包名）
#  看 ChatClient 的请求/响应时打开；生产环境注意敏感信息
# ------------------------------------------------------------
logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# 重试/超时的关键路径日志用 INFO 级别输出（重试几次、为什么重试，是排障第一现场）
logging.level.ai.agent.service=INFO

# ------------------------------------------------------------
#  超时与重试（学习点 9）
#  代码见 ai.agent.config.ChatCallProperties + ai.agent.service.support.chat.ChatRetryPolicy
#
#  【重要】只有"首个增量到达之前"的失败才会重试：
#  已经吐出内容再重发，用户会看到两段拼接的回答。
#
#  三个超时值必须满足以下大小关系，否则会出现"后端还在重试、前端已报超时"的假故障：
#     后端首字超时(20s) + 各次退避 < 前端首字节超时(30s) < 前端整体超时(180s)
#  前端那两个值在 web/src/api/chat.ts 里改。
# ------------------------------------------------------------

# 最大重试次数（不含首次调用）→ 最坏情况总共 3 次调用
ai.chat.retry.max-attempts=2

# 退避：0.5s → 1s（×2 递增），单次上限 5s；jitter=0.2 表示实际等待在 ±20% 内随机，
# 避免上游恢复瞬间被所有客户端同时重试打挂（重试墙）
ai.chat.retry.initial-backoff=500ms
ai.chat.retry.multiplier=2.0
ai.chat.retry.max-backoff=5s
ai.chat.retry.jitter=0.2

# 只有这些状态码值得重试：429 限流、5xx 服务端临时故障。
# 401/403/404 这类"请求本身有问题"重试多少次都一样，只会掩盖真正的配置错误
ai.chat.retry.retryable-status-codes=429,500,502,503,504

# 首个增量（首字）最长等待：建连 + 模型排队 + 思考时间都算在内。
# 注意首字延迟实测有 3.7s，DeepSeek 高峰期可能到 10s 以上，20s 是留了余量的
ai.chat.timeout.first-token=20s

# 相邻两个增量之间的最大间隔。取 30s 而不是跟首字一样 20s：
# 模型写在长回答中途"想一下"时静默十几秒是正常的，设太小会把正常回答拦腰截断
ai.chat.timeout.idle=30s

# ------------------------------------------------------------
#  系统提示词（对话与结构化输出这一条链路）
#
#  ⚠️ 【阶段四第 3 件之后：这一行已经**不影响运行时**了】
#  运行时读的是版本库里当前生效的那一版，而它在**每一次请求**上被重新注入
#  （`ChatServiceImpl` / `StructuredChatServiceImpl` 的 `.system(...)`）。
#
#  【为什么是"每次请求"而不是"构建 ChatClient 时"】
#  实测（javap 核过字节码）：`ChatClientBuilder.defaultSystem(Resource)` 在**构建那一刻**
#  就调用了 `Resource.getContentAsString()` —— 也就是说
#  **换一个"每次读都返回新内容"的 Resource 并不能让它热更新**，内容在启动时就被取走了。
#  所以热更新的落点只能在调用点。这一条很容易被想当然地做错，
#  而错了的现象是"改了提示词没反应"，排查方向会跑到模型上去。
#
#  这一行现在只剩一个含义：**出厂默认值与回滚去处的位置**（库空时拿它建第 1 版）。
ai.chat.system-prompt-location=classpath:prompts/system-agent.st

# ------------------------------------------------------------
#  结构化输出 + JSON 校验 + 回灌重试（学习点 6）
#  代码见 ai.agent.service.chat（StructuredChatService 契约）+ ai.agent.service.impl.chat（实现）
#
#  【实测结论·很重要】DeepSeek 只支持 response_format=json_object，
#  **不支持** json_schema（strict）—— 发过去会返回：
#      {"error":{"message":"This response_format type is unavailable now"}}
#  也就是说：供应商**没法**从协议层保证字段齐全、类型正确、取值合理。
#  json_object 的保证只有一条："输出是合法 JSON"。
#  所以"模型输出漏字段 / confidence 给了 95 / keywords 是空数组"这三类错误
#  **JSON 解析全会成功**，只能靠应用侧的 JSR-380 校验识破，再回灌让模型自己改。
#  这就是本模块存在的理由 —— 校验不是锦上添花，它是唯一的正确性保障。
# ------------------------------------------------------------

# 回灌重试最大轮数（含首次调用）。3 = 初次 1 次 + 最多回灌 2 次，之后走兜底答案
ai.chat.structured.max-attempts=3

# 是否要求模型走 JSON 模式。DeepSeek 支持 json_object，故默认开；
# 换到只认提示词、不认 response_format 的供应商时关掉即可（校验与回灌逻辑不受影响）
ai.chat.structured.json-mode=true

# 可接受的最低自评置信度。0.0 = 不设门槛；调到 0.6 则"我不确定"（低 confidence）
# 会被判为不合格并要求重答 —— 适合字段抽取这类"必须给确定答案"的场景。
# 调试技巧：设成 0.99 可以**确定性地触发校验失败**，用来验证回灌重试真的在工作
ai.chat.structured.min-confidence=0.0

# 可观测性：想要 trace 与 token 统计时打开（阶段四）
# management.endpoints.web.exposure.include=health,metrics
management.observations.key-values.application=ai-agent

# ------------------------------------------------------------
#  Token 预算校验（学习点 2）
#  代码见 ai.agent.service.token.TokenBudgetGuard + TokenEstimator
#
#  公式：contextWindow × (1 - safetyMargin) ≥ 估算输入 + maxOutputTokens
#        └────────── 可用预算 ──────────┘   └──── 本次要花的额度 ────┘
#
#  【为什么必须自己算】Token 数由分词器决定，而 DeepSeek 不公开发布分词器，
#  精确值只有"发出去之后"才知道 —— 但预算校验的价值恰恰在于"发之前就知道"。
#  自己算 = 一次本地计算（微秒级、0 成本）；等模型报错 = 先花一次往返的钱和几秒。
#  更坑的是有些供应商不报错而是**静默截断输入**，表现为"越聊越傻"，根本无法排查。
# ------------------------------------------------------------

# 总开关。排障时可以先关掉，用来确认"是不是预算校验把请求拦了"
ai.chat.budget.enabled=true

# 模型上下文窗口（输入 + 输出共享）。DeepSeek 为 128K。
# 这是**供应商能力**不是我们的参数，换模型必须跟着改
ai.chat.budget.context-window=128000

# 为模型输出预留的额度。必须显式留：输入输出共享窗口，
# 不留就会出现"输入塞满窗口 → 模型没地方写 → 回答被从中间切断"（实测过 JSON 截断）
ai.chat.budget.max-output-tokens=2048

# 安全边际 15%（资料给的经验区间 10%~20%）。
# 为什么不能是 0：① 估算必然有误差；② system 提示词、角色包装、工具定义都要占额度；
# ③ 供应商可能悄悄改默认值。留小了会偶发超窗，留大了会早早拒绝本来能过的请求
ai.chat.budget.safety-margin=0.15

# 超预算时是否自动裁掉最旧的对话历史（而不是直接拒绝）。
# 对话越来越长是常态，"一超限就报错"体验很差；但裁到连本次提问都放不下时仍会拒绝
ai.chat.budget.truncate-history=true

# 裁剪后至少保留的历史条数。不裁到 0：全丢掉等于让模型失忆，
# 用户会觉得"聊着聊着它就不认识我了"，比报错更难排查
ai.chat.budget.min-history-messages=2

# ------------------------------------------------------------
#  对话记忆窗口（按**条数**限制）
#
#  【先看一段：对话消息现在**存在系统内存里**，不落库】
#  存储层是 `ChatClientConfig#chatMemoryRepository()`，它现在返回的是
#  `new InMemoryChatMemoryRepository()`（Spring AI 提供，内部就是一个 JVM 堆内的 Map，
#   key = conversationId）。后果有三条，都是"不报错的错"：
#    ① 进程退出（重启 / 重新部署）→ 所有会话记忆清空，conversationId 传得再对也没用；
#    ② 多实例部署 → 记忆不共享，同一个 conversationId 被分到另一台就像换了个人，
#       而且是**偶发**的（取决于打到哪台）；
#    ③ 没有过期与清理 → 会话对象只增不减。
#  模型平台那边也**不存**（chat/completions 无状态，历史每次都随请求发过去）；
#  数据库里**也没有对话正文**（agent_run / agent_step 只有 conversation_id 这个归因键）。
#
#  【要改成存库：改代码那一行的实现，本文件没有开关】
#  `chatMemoryRepository()` 换成官方实现 —— 就用 `JdbcChatMemoryRepository`
#  （`org.springframework.ai.chat.memory.repository.jdbc`，MySQL / H2 都有现成方言与 schema 脚本）：
#      pom 加 `spring-ai-starter-model-chat-memory-repository-jdbc`（版本由 spring-ai-bom 管），
#      然后 `return JdbcChatMemoryRepository.builder().dataSource(dataSource)
#              .dialect(JdbcChatMemoryRepositoryDialect.from(dataSource)).build();`
#  上层（记忆 advisor、窗口、预算裁剪、重试清理）注入的全是 `ChatMemoryRepository` 接口，
#  一行都不用改。完整写法与四个前置条件（库还是内存库、与自动配置抢 bean、
#  建表默认只对嵌入式库生效、官方 DDL 的 conversation_id 只有 36 字符）写在
#  `ChatClientConfig#chatMemoryRepository()` 的方法注释里。
#  ⚠️ 换之前先看下面的 `ai.agent.store.url`：换成 JDBC 实现之后，"记忆到底存在哪"
#     就完全由那一行决定了（它现在是 MySQL；改成内存库的话，落库会看起来生效、实际重启照样清空）。
#
#  【与 Token 预算的关系，实测踩过】这两个限制量纲不同：
#  这里是"最多几条消息"，预算是"最多多少 token"。谁先触发取决于消息有多长。
#  实测（窗口 3000、默认 20 条）：第 11 轮时历史 20 条、需要 2058 tokens，
#  而预算是 2150 —— **被条数窗口抢先挡住了，预算的裁剪逻辑一次都没跑到**。
#  也就是说：想验证 Token 预算这条链路，必须先把条数窗口放大到不再抢先，
#  否则会得出"预算校验好像没生效"的错误结论。
#
#  生产建议：按对话实际长度设置。长文档问答场景下，20 条可能对应几万 token，
#  这时真正该管的是预算，条数窗口只是兜底。
# ------------------------------------------------------------
ai.chat.memory.max-messages=20

# ------------------------------------------------------------
#  【必须打开】把 ResponseStatusException 的 reason 带回响应体
#
#  踩坑记录：这个开关不打开时，预算拒绝的响应体长这样：
#      {"timestamp":"...","status":400,"error":"Bad Request","path":"/api/chat/structured"}
#  —— 我们精心写的那句
#      "上下文预算超限：本次提问约 2280 tokens，可用预算 1075（窗口 1500 × 安全边际 85% 后
#       扣掉为输出预留的 200）。建议：把问题拆小..."
#  **一个字都没到客户端**，只进了日志。
#
#  根因：Spring Boot 默认 server.error.include-message=never —— 它故意不把异常 message
#  回传给客户端，理由是"内部异常信息可能泄露实现细节"。这个默认值对系统异常是对的，
#  但对**我们自己构造的、面向用户的业务错误**恰恰相反：
#  这类 message 是唯一能让用户知道"差多少、该怎么办"的东西，
#  藏起来的结果是用户只看到"400 Bad Request"，完全无从下手。
#
#  这也是一个通用教训：**"错误信息里有什么"必须端到端验证** ——
#  真正决定用户看到什么的是序列化配置，而不是异常对象里有没有那句话。
# ------------------------------------------------------------
server.error.include-message=always

# 估算系数（**实测校准值**，不是拍脑袋定的）
#
# 校准方法（可复现）：对同一段文本做不同长度的扫描（重复 1/5/20/50/200 次），
# 用真实模型的 usage 拟合出「边际密度」和「固定开销」：
#     英文：0.152 token/字符 → 6.6 字符/token；中文：0.609 token/字符
#     固定开销（系统提示词 + 消息包装）：约 236 tokens
# 实现在 ai.agent.controller.TokenCalibrationController。
#
# 为什么不能一个"字符 ÷ 4"走天下：那是英文的经验值，而且对 DeepSeek 也偏高 ——
# 混进中文会低估近 2 倍，纯英文又高估 1.6 倍，两个方向都错。
#
# 为什么最终取值略高于实测值：估算宁可偏保守（低估 = 超窗没拦住，
# 高估 = 历史多裁一点，代价不对称）。这是**第二道**余量，
# 第一道是 ai.chat.budget.safety-margin 的窗口级 15%
ai.chat.estimation.ascii-chars-per-token=5.5
ai.chat.estimation.cjk-tokens-per-char=0.75
ai.chat.estimation.other-tokens-per-char=1.5
ai.chat.estimation.tokens-per-message=4
ai.chat.estimation.tokens-per-request=3

# ------------------------------------------------------------
#  虚拟线程与异步执行（学习点 7）
#  代码见 ai.agent.config.VirtualThreadConfig + ai.agent.service.chat.ChatExecutionService
#
#  【四件事不是一个开关】容器层（谁来接请求）/ 业务层（谁来等阻塞）/
#  超时层（改造后"忘了设超时"的代价变高）/ 依赖库层（synchronized 钉住载体、ThreadLocal）
#
#  【顺序不能反】必须先有超时、再放宽并发。虚拟线程让"阻塞的代价"变得极低，
#  于是"忘了设超时"的代价变得极高 —— 线程池满了会逼你处理，10 万个挂着的虚拟线程不会
# ------------------------------------------------------------

# 容器层：给 Tomcat 连接器换上虚拟线程执行器。
# 关掉它就回到"一个请求一个平台线程"，用于做同步 vs 虚拟线程的对照压测
ai.chat.virtual-threads.enabled=true

# 业务层：非流式调用的执行模式
#   virtual  = 每个任务一个虚拟线程（默认，生产用这个）
#   platform = 固定大小平台线程池（对照用；池大小 = 下面那个值）
#   auto     = 不切线程，直接在容器线程上跑（改造前的行为）
ai.chat.virtual-threads.async-executor=virtual

# 对照模式下平台线程池的大小。取 8 是刻意的**小值**：
# 它把"线程数 = 并发上限"这个约束从"要 500 并发才撞得到"变成"8 并发就撞得到"，
# 于是阻塞式设计的问题几秒钟就能复现，不必打满 200 个容器线程
ai.chat.virtual-threads.platform-pool-size=8

# ------------------------------------------------------------
#  压测替身（默认关闭，不影响正常使用）
#  把不可控的模型调用换成一段可控的固定延迟，让"同步 vs 虚拟线程"的对比
#  除了线程模型之外**没有任何别的变量**
#（真实模型不可重复、还会污染对比数字）
#
#  用法：用启动参数打开，例如
#      mvn spring-boot:run "-Dspring-boot.run.arguments=--ai.chat.sampling.latency=400ms"
#  400ms 接近一次真实模型往返的量级，且完全可控
#
#  注意：这一节保留的是"替身能力"本身，它是靠这段配置 + ChatExecutionService
#  里的一个判断实现的；当时的压测脚本属于一次性工具，已经删掉，
#  实测数字见 Token / 虚拟线程那两组实测数据
# ------------------------------------------------------------
ai.chat.sampling.latency=0s
ai.chat.sampling.response=采样响应

# ============================================================
#  阶段二（RAG）：文档解析 + 分块 + 检索评测
#  代码见 ai.agent.service.rag.*（配置绑定在 ai.agent.config.rag.RagProperties）
#
#  【这一阶段要回答的问题】不是"RAG 能不能跑通"，而是
#  「换分块策略提升了多少」—— 必须是数字，不能是"好像变好了"。
#
#  为此本模块的形态与阶段一不同：阶段一是在线链路（一次请求怎么发），
#  这里是**离线实验台** —— 同一份语料、同一套评测集、同一个检索器，
#  只换分块策略各跑一遍，把指标并排摆出来。
# ============================================================

# ------------------------------------------------------------
#  语料库
#
#  为什么按目录扫而不是逐个列文件：RAG 调参本来就该是"丢几份文档进去、
#  跑一遍看数字"。逐个列文件会让"加一份文档"变成"改配置 + 重启"。
#
#  当前语料是**本项目自己的 4 份 Markdown 文档**（84200 字符），
#  由 scripts/build-rag-corpus.ps1 生成快照。用真实项目文档而不是编造的语料，
#  是因为真实文档自带"表格 + 多级标题 + 密集数字"这些真正影响分块的结构。
#  想换成企业文档：改这一行指向本地目录即可（file:./docs），不需要重新打包。
# ------------------------------------------------------------
ai.rag.corpus.location=classpath:rag/corpus
ai.rag.corpus.extensions=md,markdown,txt,html,htm,pdf,docx

# 单文件上限 32MB。它不是"省内存"，而是给"有人把 2GB 的日志丢进来"
# 一个明确的上界 —— 没有上界时，一份文档的问题会变成整个应用 OOM
ai.rag.corpus.max-file-size-bytes=33554432

# ------------------------------------------------------------
#  分块策略 A：固定字数硬切（**对照组**）
#
#  留着一个"错误做法"是刻意的：没有它，"语义分块更好"就只是一句信仰。
#  默认值选了 500 字 / 50 字重叠 —— 这是教程里最常见的那组数字，
#  所以量出来的差距是"我的做法 vs 常见做法"的真实差距，而不是自己挑的软柿子。
#
#  【注意 overlap 不能省】重叠不是语义分块的专利，它是防边界切断的通用手段。
#  两组都开 overlap，差异才能干净地归因到"切点选在哪"。
# ------------------------------------------------------------
ai.rag.chunking.fixed.size=500
ai.rag.chunking.fixed.overlap=50

# ------------------------------------------------------------
#  分块策略 B：结构感知分块（按标题层级 + 段落边界）
#
#  三个参数缺一个就退化：
#    max-tokens 防超窗；min-tokens 防碎片；overlap-tokens 防边界切断。
#
#  【min-tokens 最容易被忽略】一个小节只有一句话时，单独成块的关键词密度太低，
#  词法检索与向量检索都吃不饱 —— 结果就是这个块永远召回不到，
#  而它可能是文档里唯一的答案。所以要把它合并进同节的相邻块。
#
#  【max-tokens 选 400 是配合对照组选的】对照组的 500 个中文字
#  ≈ 375 token（中文实测 0.75 token/字），与 400 同一量级。
#  这样两组差异主要来自"切在哪"，而不是"切多大" —— 变量控制住，
#  结论才归因得清（本项目踩过一次"默认的条数窗口会抢先挡住新加的长度限制"，
#  就是变量没按住的反面教材）。
# ------------------------------------------------------------
ai.rag.chunking.structural.max-tokens=400
ai.rag.chunking.structural.min-tokens=80
ai.rag.chunking.structural.overlap-tokens=50

# 单段超过这个大小就必须拆（一张大表格很常见）。
# 不拆的话，"装不下就换新块"会陷入"新块也装不下"的死循环
ai.rag.chunking.structural.hard-split-threshold-tokens=800

# 是否把标题面包屑拼进块正文。
# 收益：块里出现了标题中的词，而用户提问常用标题里的词（问"虚拟线程的坑"时，
#      正文里可能一次都没写"虚拟线程"四个字）。
# 代价：每块多占几十 token。
# 【做成开关是因为它该用数字决定】—— /api/diag/rag/compare 可以把
# 这个开关的两组结果并排跑出来，而不是凭感觉开或关。
ai.rag.chunking.structural.include-heading-breadcrumb=true

# 面包屑最多保留几层。不限制的话深文档会看到
# "总则 > 第二章 > 第三节 > 2.3.1 > ……"占掉一大截
ai.rag.chunking.structural.heading-depth=3

# ------------------------------------------------------------
#  检索
#
#  当前只有词法检索（Lucene BM25 + 中文二元组）。
#  最终形态是混合检索（向量兜语义 + BM25 兜精确 + RRF + Rerank），
#  到那时只需再加一个 Retriever 实现与一个融合器，评测代码一行都不用改。
#
#  topK 取 10：分层是「粗召回 30–100 → Rerank 后 5–10 → 进上下文 3–6」，
#  评测阶段取 10 足够看出名次差异，指标也不至于多到失焦。
# ------------------------------------------------------------
ai.rag.retrieval.top-k=10
ai.rag.retrieval.report-at-k=1,3,5,10

# ------------------------------------------------------------
#  向量那一路的参数（ai.rag.vector.*）
#
#  【为什么这里只有一段说明、没有可执行的行】
#  这几个键的**默认值写在代码里**（`ai.agent.config.rag.EmbeddingProperties`，
#  作为 `RagProperties` 的嵌套属性注册），而这里刻意**不把它们再抄一遍** ——
#  两处各写一份默认值，迟早会漂移，而漂移时的现象是"我只改了一处却不生效"。
#  这一段的用途只有一个：**让读配置的人知道有这几个键、以及该去哪里改**。
#
#    ai.rag.vector.hash.dimensions        （代码默认 512）
#    ai.rag.vector.hash.terms-per-dimension（代码默认 3）
#        这两个一起决定**碰撞率**：维度越大碰撞越少，每词项落几维决定表达能力。
#        碰撞过多时相似度会整体被抬高（所有块看起来都像），表现为"召回率虚高、MRR 很低"。
#    ai.rag.vector.search.scan-limit      （代码默认 0 = 不限制，全扫）
#        纯暴力检索，所以这个值就是**成本上界**。真向量库靠 ANN（HNSW/IVF）避免全扫 ——
#        这个参数就是本实现与真库之间那条边界线上的哨兵。
#    ai.rag.vector.search.min-score       （代码默认 0.0 = 不过滤）
#        余弦相似度是**相对度量**，永远有"最像的一条"，哪怕它跟提问毫无关系。
#        没有阈值时，一个完全无关的提问也会拿到 top-10，而"召回了但全不相关"
#        与"没召回"在指标上看起来完全不同（前者拉低 Precision，后者拉低 Recall）。
#
#  ⚠️ 换真 Embedding 模型时**必须全量重建索引**：索引里存了指纹（模型名 / 维度），
#     维度不一致会在检索时直接抛，而不是给个警告继续跑（那样只会产出看起来正常的错数据）。
#     详见 ai-agent/docs/向量库环境记录.md。
# ------------------------------------------------------------

# ------------------------------------------------------------
#  评测
#
#  【min-usable-cases 这个门槛为什么重要】理由很直接：
#  「别只问两三个问题觉得还行」。样本太少时指标会剧烈波动，
#  引用出去就是误导。
#
#  但它**不拒绝执行**，而是在报告里打上"样本量不足、结论不可用"的标注 ——
#  调参阶段确实会想用几条用例快速试，一刀切禁止会把人逼去绕过工具；
#  带上标签则既方便调参，又防止那些数字被当成结论。
# ------------------------------------------------------------
ai.rag.evaluation.eval-set-location=classpath:rag/eval-set.tsv
ai.rag.evaluation.min-usable-cases=30

# ------------------------------------------------------------
#  Agent 循环（阶段三 · 学习点 5 + 手写 ReAct）
#
#  【三个上限必须同时存在】它们拦的是三种不同的死法，缺一个就有一种漏网：
#    max-steps    模型在原地打转（反复调同一个工具）
#    max-tokens   单轮上下文极长（一次检索塞进几千 token）
#    max-duration 下游变慢（模型排队、工具卡住）
#  只限 token，模型用极短调用也能转几百轮；只限步数，6 步 × 8000 token 也够烧一笔钱；
#  只限前两个，一轮卡 5 分钟照样"没超限"。
#
#  【为什么这几个数字是这些值】按本项目真实的工具耗时定的：
#    - 典型任务 2~3 轮（列文档 → 检索 → 读章节），6 轮给了"试错两次"的余量；
#    - 一轮工具往返约 1500~2500 token，6 轮约 1 万，12000 留了点余量；
#    - 单轮实测 1~4 秒（本地检索是毫秒级，耗时主要在模型），6 轮正常 20 秒内，
#      60 秒能容下"模型偶尔慢"但不至于让用户以为页面挂了。
#
#  ⚠️ max-tokens 与下面 ai.tool.feedback.max-chars 是**联动**的：
#     调大回填上限（每次工具返回更多内容）就必须一起调大这里，
#     否则表现为"工具还没调几次就超预算了"，而原因看起来在工具上。
# ------------------------------------------------------------
ai.agent.loop.max-steps=120
ai.agent.loop.max-tokens=1200000
ai.agent.loop.max-duration-ms=120000
# 同一个工具 + 同一份参数允许出现几次。2 = 允许重复一次（有时确认结果稳定是合理的），
# 第 3 次就判定"模型卡住了"。设 0/1 都可以（更严格），负数是非法配置。
ai.agent.loop.max-identical-actions=2

# ⚠️ 【阶段四第 3 件之后：这两个 system-prompt-location 已经**不影响运行时**了】
#
#  在此之前，提示词就是这两个 classpath 文件：改一个字要重新打包、重启。
#  从阶段四第 3 件（Prompt 版本管理 + 配置热更新）起，运行时读的是**版本库里当前生效的那一版**
#  （`ai.agent.service.prompt.PromptService.currentContent`），而这两个属性只剩一个含义：
#  **出厂默认值与回滚去处的位置** —— 启动时库是空的话，会拿这两个文件建出第 1 版。
#
#  【为什么刻意保留这两行，而不是删掉】
#  删掉会让老配置文件里的这两行变成"未知属性"（启动警告），而更糟的是：
#  **一条看起来还在生效、实际已经不生效的配置，是最难查的一类问题**。
#  留着它、并在注释里写清它现在管什么，读者就不会以为"改了它就能换提示词"。
#
#  【那现在怎么改提示词】走界面第七种模式（Prompt 版本）或 `POST /api/prompts/{kind}/versions`
#  + `POST /api/prompts/{kind}/activate`。历史只追加、回滚也是一次新增，理由见 `PromptStore`。
ai.agent.loop.system-prompt-location=classpath:prompts/system-agent-tools.st

# ------------------------------------------------------------
#  工具结果回填给模型的长度上限（字符）
#
#  【为什么这个数直接等于"每次工具调用烧多少 token"】
#  检索类工具最容易踩：一次返回 10 个块、每块 200 token 就是 2000 token 进上下文，
#  而其中往往只有一两条有用。这个上限就是"检索预算"在工具层的入口，
#  也是本项目「把检索预算纳入 Token 账目」那一条的落点。
#
#  超限时**必须显式告诉模型"结果被截断了"**（见 ToolFeedbackFormatter 规则 3）：
#  截断了不说，模型会以为"这就是全部"，于是拿半截检索结果给出一个看起来完整的答案。
# ------------------------------------------------------------
ai.tool.feedback.max-chars=2000

# ------------------------------------------------------------
#  Agent 状态持久化与断点恢复（阶段三）
#
#  【当前是 MySQL，落库因此是真的】
#  这四行指向一个**进程退出不会清空**的库，所以断点恢复这条能力在当前配置下成立
#  （要复现"库里留着 RUNNING 行"那种状态，也必须是这样一个库 —— 内存库里造不出来）。
#  要临时退回内存库（CI、只想跑一遍看看）：把 url 换成
#      jdbc:h2:mem:agent;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1   （username=sa，password 留空）
#  那一串的 DDL 与本库共用同一份，不用改一个字。
#  取舍：内存库跑得快、不残留，但**进程一退什么都没了** ——
#  "改了配置没改 url，于是以为落库了其实没有"是本项目明确列过的一类风险。
#
#  【MODE=MySQL 那个兼容模式只跟内存库那一条有关】它让 H2 接受 MySQL 写法的
#  DDL 与 SQL，于是两种库能共用同一份 DDL。实测确认 H2 2.3.232 在这个模式下接受
#  AUTO_INCREMENT / TEXT / ON UPDATE CURRENT_TIMESTAMP / INSERT ... ON DUPLICATE KEY UPDATE。
#  ⚠️ MySQL 的**前缀索引** `INDEX (col(64))` 在 H2 兼容模式下**不被接受**，所以 DDL 里没有它。
#
#  【node 是做什么的】多实例部署时用它区分"这条 RUNNING 是谁留下的"。
#  不区分的话，B 实例启动时会把 A 实例**正在跑**的运行误判成中断并抢过来，
#  于是同一次任务的工具被执行两遍 —— 这就是"重复副作用"。
#
#  【顺带说明它与"对话记忆"的关系，容易混】这个库存的是**过程数据**：
#  agent_run / agent_step / agent_tool_invocation / retrieval_hit 等运行轨迹（含 conversation_id 这个归因键）。
#  **对话消息正文不在这个库里**：它走 ChatClientConfig#chatMemoryRepository() 的内存实现
#  （见上面"对话记忆窗口"那一节的说明）。
#  也就是说：重启之后 Agent 的 trace 还在、而对话记忆仍然是空的。
#  ⚠️ 反过来，哪天把 chatMemoryRepository 换成 JDBC 实现时，它用的就是**这一行的 url** ——
#     那时这个库必须有 chat_memory 那几张表（官方 SQL 建，见 ChatClientConfig 的注释）。
# ------------------------------------------------------------
#  【url 里的参数逐个说清，因为每一个漏掉都有一种安静的坏法】
#   useUnicode/characterEncoding=utf8 —— 中文问题（DDL 注释、提示词正文、工具参数都是中文）
#   connectionTimeZone=Asia/Shanghai  —— **不能写 SERVER**：这台 MySQL 的
#       @@system_time_zone 是中文（"中国标准时间"），Connector/J 认不出它，
#       而它认不出时的报错发生在 nativeSQL 上（不是建连时）——
#       现象是"连上了、简单查询也过了，一用 PreparedStatement 就炸"。
#       写死一个具体时区值同时也钉住了时间语义：TIMESTAMP 的读写都按它解释，
#       换机器（JVM 时区不同）不会让 created_at 悄悄平移
#   allowPublicKeyRetrieval=true —— MySQL 8 默认 caching_sha2_password，
#       非 TLS 连接下第一次要取服务端公钥，不给会被拒（useSSL=false 时尤其）
#   useSSL=false —— 本地开发库不走 TLS；连远程库时应改回 true 或去掉这一项
ai.agent.store.url=jdbc:mysql://localhost:3306/db_ai_agent?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
ai.agent.store.username=admin
ai.agent.store.password=admin
ai.agent.store.node=local
# 关闭的理由见 AgentRunRecoveryOnStartup 的注释：恢复意味着启动就调模型（会花钱），
# 而"事故后先看看遗留的是什么任务再决定恢复哪些"是运维该有的判断机会。
ai.agent.store.auto-resume-on-startup=false

# ------------------------------------------------------------
#  建表：由 Spring 的脚本初始化执行，不再是三处手写的 split(";")
#
#  【为什么换掉那段手写逻辑】原来的做法是把整份 DDL 按分号切开、再逐行砍掉
#  `--` 之后的内容，然后一条条 execute。它的正确性依赖一个没说破的前提：
#  **注释里不能出现分号**（原代码里就留着这条警告）。而 Boot 的脚本执行器
#  是真正解析 SQL 的（识别注释、字符串字面量、语句边界），前提不再需要人记着。
#
#  【为什么六份文件都用同一个 `always`】它们各自都是幂等脚本 ——
#  `CREATE TABLE IF NOT EXISTS`，于是"启动一次 = 对齐一次表结构"，不需要版本表
#  （真正的迁移机制等有"线上已有数据要保"的需求时再引，与原先的取舍一致）。
#  ⚠️ 顺序有含义：agent-schema.sql 里的表被另外几份的读侧引用（成本看板读 agent_step）。
#  permissions-schema.sql 内部有外键（agent_user_role → agent_user / agent_role），
#  它那三张表的建表顺序写在同一份文件里、不依赖跨文件顺序；task-schema.sql 同理
#  （agent_task_confirm → agent_task）。skill-schema.sql 只有一张表、无外键。
#
#  【索引不在这里建，虽然它们就写在下面这几份文件里】
#  脚本里的索引语句是 `CREATE INDEX IF NOT EXISTS ...`，而 **MySQL 8.0 不支持这个语法**
#  （实测 8.0.17 报 1064；H2 支持）—— 让它留在这里的结果是"第一次启动能建表、
#  第二次启动直接起不来"。所以那几行由 AgentStoreConfig 挑出来、
#  先问库里的元数据"这个索引在不在"再建，其余语句（建表）仍然走这里。
#  这也是"启动时对齐表结构"这条纪律能同时在 H2 与 MySQL 上成立的原因。
# ------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/agent-schema.sql,classpath:db/alert-schema.sql,classpath:db/prompt-schema.sql,classpath:db/permissions-schema.sql,classpath:db/task-schema.sql,classpath:db/skill-schema.sql
spring.sql.init.encoding=UTF-8

# ------------------------------------------------------------
#  MyBatis
#
#  【mapper 位置显式写出来】不靠"约定大于配置"：mapper XML 是这些 SQL 唯一的家，
#  一个路径写错会让应用**正常启动**、到第一次查询才报 "Invalid bound statement"——
#  那种错看起来像接口写错了方法名。
#
#  【为什么 resultMap 里仍然逐列写、而不是靠 map-underscore-to-camel-case】
#  驼峰映射是一条全局捷径，但它对**构造器映射**（record 用的那种）不生效，
#  而且一旦有人改了这里的开关，所有靠它的查询会**静默**少映射几个字段
#  （值为 null，不报错）。所以每一列的对应关系写在 XML 里，读代码时就看得全。
# ------------------------------------------------------------
mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# 让 MyBatis 把 WARN 以上的 SQL 细节打出来（开发期默认开）；生产调成 INFO 可关
logging.level.ai.agent.mapper=DEBUG

# ------------------------------------------------------------
#  Agent 侧的并发保护（阶段三第 3 件）
#
#  【它兑现的是阶段一留下的那条风险】
#  虚拟线程改造把"容器线程不够"解决了（2000 并发吞吐 472 → 1192.6 req/s），
#  代价是**瓶颈转移到了下游**：模型服务与工具。没有这一层，虚拟线程会安静地开出
#  成千上万个在途请求 —— 而"安静"正是最危险的地方：平台线程时代线程池满了会排队/拒绝、
#  逼着你处理；现在它会一直开线程，你会以为系统很闲，直到下游配额被打满或开始回 429。
#
#  【三种保护，各拦一种东西，不能只做一个】
#    max-concurrent-*    同时几个在途   —— 没有它，下游被安静地打满
#    acquire-timeout-ms  等不到就拒绝   —— 没有它，请求无限排队：界面转圈、没有错误、也没有失败
#    circuit.*           下游是不是坏了 —— 没有它，一个坏下游每个请求都要等满超时才失败
#
#  【为什么用信号量而不是"每秒 N 个"的限流】
#  真正的约束是下游能同时扛住多少**在途**请求，不是每秒能收多少。
#  速率限制只数"发起"、不数"还没回来"，于是下游一变慢，在途请求就越堆越多 ——
#  而那恰恰是最需要保护的时候。信号量直接把"在途"按住。
#
#  【max-concurrent-model-requests 的依据是"下游配额"，不是本机 CPU】
#  这一点很容易搞错：虚拟线程之后，CPU 核数已经不再是这个量的约束了。
#  8 是"本地开发够用、又不会把免费额度打满"的起点，生产按你的账号并发配额调。
# ------------------------------------------------------------
ai.agent.concurrency.max-concurrent-model-requests=8

# 【每把工具各自 N 个，不是全局共享 N 个】
# 全局共享会让"一把慢工具"占满所有名额、把其它健康工具一起饿死 ——
# 那是把一个局部故障放大成全局故障。按工具隔离之后，"报表工具坏了"只影响报表工具。
ai.agent.concurrency.max-concurrent-tool-requests=4

# 排队超时。**不允许设为 0 或负数**（配置类里会直接抛）：那表示无限等待，
# 而虚拟线程让无限等待的成本极低 —— 会把故障模式变成"静默挂起"。
# 5 秒的依据是量级：模型调用 1~4 秒、工具毫秒级，等 5 秒意味着"前面的快结束了"，
# 而不是"排在一个看不到头的队尾"。
ai.agent.concurrency.acquire-timeout-ms=5000

# 熔断：连续大面积失败时别再让每个请求都去撞一次（每次撞都要等满超时，而那些等待没有成功可能）
#   failure-rate-threshold=0.5 一半失败就认为下游病了（比 0.1 松，因为工具的失败可能来自数据本身）
#   minimum-calls=5            最少 5 次才评估 —— **这个不能省**：没有它，首次失败就是 100% 失败率，
#                              一个刚启动的健康工具会被立刻熔断
#   window-size=20             滑动窗口按"最近 N 次"而不是"最近 N 秒"：次数窗口与请求量无关，
#                              时间窗口在低流量下永远凑不够 minimum-calls，表现是"配了但从来没打开过"
#   open-duration-ms=10000     冷却期。太短会刚打开就去撞，太长会让已恢复的下游白白闲置
#   half-open-probes=1         半开只放 1 个试探：目的是拿一个样本判断"好了没有"，
#                              并发去撞只会在没好时白挨几下
ai.agent.concurrency.circuit.enabled=true
ai.agent.concurrency.circuit.failure-rate-threshold=0.5
ai.agent.concurrency.circuit.minimum-calls=5
ai.agent.concurrency.circuit.window-size=20
ai.agent.concurrency.circuit.open-duration-ms=10000
ai.agent.concurrency.circuit.half-open-probes=1

# ============================================================
#  人工确认（HITL）—— 阶段三第 9 件
#  代码见 ai.agent.service.agent.approval.*（服务与存储）+ ai.agent.service.tool.ToolApprovalGate（闸门接口）
#
#  【它回答的验收原话】阶段三：「能讲清「它为什么选这个工具、失败重试几次、
#  **什么时候让人确认**、日志能不能还原执行过程」」。前两条第八轮已能看见，
#  而"什么时候让人确认"在**写操作出现之前根本没东西可看** ——
#  这也是 HITL 与"写工具 / MCP Server"绑在一起、要求一起做的原因。
#
#  【判据不在配置里，在工具自己的声明里】
#  哪把工具需要审批由 ToolHints 决定（ai.agent.entity.model.tool.ToolHints）：
#  只读 → 免审批；幂等的写 → 免审批；其余（非幂等的写）→ 必须审批。
#  做成配置项的话，就会出现"某把工具的危险性与它的声明各说一套"。
#
#  【默认打开，而不是默认关闭】
#  它保护的是**不可逆的副作用**，而它失效时不会有任何报错。
#  默认关闭的话，一个部署会把高危写操作直接放行、日志上一切正常 ——
#  那正是「装上了」与「真在生效」是两件事的形状（"我配了保护"与"保护真的装着"是两件事）。
#  反过来，"默认打开"的代价是响亮可见的（有人抱怨卡住 → 去看一眼就知道没接审批界面）。
# ------------------------------------------------------------
ai.agent.approval.enabled=true

# 等人确认的最长时长。**不允许 0 或负数**（配置类构造期直接抛）——
# 那表示"永远等下去"，而虚拟线程让无限等待的代价极低，
# 故障模式会从"报错"变成"静默挂起"（与 acquire-timeout-ms 同一条规则）。
#
# 【超时按"拒绝"处理，不是"默认通过"—— 这是本模块最重要的取向】
# 没人管事时系统应该**停下来**，而不是照常写数据：
# "没人管事"恰恰是审批流失效最常见的形态，而"默认通过"会让这道闸门
# 在最需要它的时候自动消失。一句话概括：**审批的默认值必须是"不做"，因为"做了"是不可逆的。**
#
# 120 秒的依据：它比任何一次模型/工具调用都长得多（那些是秒级），
# 又短于"人离开工位"的量级（那是分钟级）——于是"人还在看页面"时它等得到，
# "人已经走了"时它明确失败而不是永远挂着。生产上应与你的值班响应时间对齐。
ai.agent.approval.timeout=120s

# 没填决定人时记谁。默认 unknown 而不是空：一条"谁批的"是空的记录，在审计时等于没有
ai.agent.approval.default-decider=unknown

# ------------------------------------------------------------
#  工作区目录与运行权限（界面「Agent 工具调用」那一页的两个参数）
#  代码见 ai.agent.entity.tool.RunPermission + service.tool.workspace.*
#
#  【它决定什么】界面上发起任务时要选一个工作区目录、并选一档权限：
#    仅可查看（READ_ONLY）    只读工具直接执行，写操作要人点头
#    工作区内修改（WORKSPACE_WRITE）  同上（本项目的工具没有路径参数，判不出"写在工作区内还是外"）
#    完全权限（FULL_ACCESS）  写操作**直接执行、不产生审核请求**
#  读操作在任何档位下都直接执行 —— 三档里没有一档叫"禁止查看"。
#
#  【判据只有一处】service/tool/workspace/AgentPermissionPolicy。
#  它永不放宽工具自己的风险声明（ToolHints），只决定"要不要产生审核请求"。
#
#  【为什么档位必须落库】恢复（断点续跑 / 批准后接着跑）没有请求体，
#  "续跑时用哪一档"只能从 agent_run.permission_level 读回来。不落库的话，
#  一次"仅可查看"的运行在恢复之后会按默认档位继续 —— 一次静默的权限放大。
# ------------------------------------------------------------

# 发起任务时是否必须给出工作区目录。
# 【为什么默认必填】界面上它就是必填的（这一件的需求原话：必选项，需要用户选择或填入工作目录）。
# 但 /api/agent/ask 同时也是 curl、脚本与外部系统的入口，把它钉死会让那些调用方一起被挡在门外 ——
# 它们本来就不该被迫声明一个目录（那些运行没有权限上下文，写操作按最严的一档处理）。
# 所以是"默认必填 + 改这一行就能放开"，而不是"默认可选、靠界面自己记得校验"：
# 后者一旦界面那侧漏了，后端不会有任何反应，而"工作区没传"在库里看起来与老数据一模一样。
ai.agent.workspace.required-on-ask=true

# 工作区路径长度上限。超限**不静默截断**（截断一个路径得到的目录与它指向的可能是两个地方）。
# 512 的依据：Windows 的 MAX_PATH 是 260（更长的要加 \\?\ 前缀），Linux 的 PATH_MAX 是 4096；
# 512 覆盖两边日常使用，同时让 agent_run.workspace_dir 保持成一个短字段。
ai.agent.workspace.max-path-chars=512

# ------------------------------------------------------------
#  文件类工具的边界（read_file / write_file / edit_file / glob / grep）
#  代码见 config/WorkspaceFileProperties + service/impl/tool/file/**
#
#  【这些数字为什么必须存在】这五把工具的返回值**直接进模型上下文**，而上下文是花钱的、
#  也是有限的：一份 3 万行的日志一次性回填，代价不只是那一次的 token ——
#  它会把之前所有的检索结果挤出窗口，于是模型拿半截上下文给出一个看起来完整的答案。
#  所以上限不是"防崩"，是"防答错"。
#
#  【超限必须说出来】每个上限撞到时，工具都会在回填文本里写清"这不是全部、剩下的怎么看"
#  （read_file 给 offset 往哪加、glob 让你收窄 pattern、grep 给实际搜索的文件数）。
#  静默截断是本项目反复列过的一类风险：模型会把"我看到的就是全部"当成事实。
# ------------------------------------------------------------

# read_file 单次最多返回多少行。2000 行 ≈ 12 万字符，已经接近回填上限
# （ai.tool.feedback.max-chars）；再大就必然被回填层截断，而由工具自己截断能带上准确的"还有多少行"。
ai.agent.workspace.file.max-lines=2000

# 单文件读/改的字节上限（read_file 与 edit_file 共用）。1 MiB 显著高于本项目自己的源码文件
# （最大的不到 200 KB），又明显低于"一眼看不完"的量级。
ai.agent.workspace.file.max-file-bytes=1048576

# write_file 单次写入的字符上限。20 万 ≈ 一份完整源码文件；执行器在解析参数时就拒绝，
# 不必等写完才发现太大。
ai.agent.workspace.file.max-write-chars=200000

# glob 单次返回的条数上限。撞到它说明 pattern 写得太宽（回填里就是这么说的）。
ai.agent.workspace.file.max-entries=200

# grep 单次返回的命中条数上限。100 行 ≈ 6000 字符，略超回填上限 ——
# 于是"下一次该收窄 pattern"这件事会由回填层与工具自己一起说出来。
ai.agent.workspace.file.max-matches=100


# ------------------------------------------------------------
#  权限管理（用户 / 角色 / 角色能调哪些工具 / 能在哪些目录下干活）
#  代码见 ai.agent.entity.agent.permission.*（实体与判据）
#        + ai.agent.service.permission.*（存储、解析、写入口）
#        + ai.agent.controller.PermissionController（端点 /api/permissions/**）
#  五张表在 db/permissions-schema.sql，由 spring.sql.init 建。
#
#  【★ 这一层现在没有登录，所以有下面第一个开关】
#  /api/permissions/** 的每一个端点都是匿名的：能访问这个端口的人可以给自己开"全部工具"。
#  当前它只绑 localhost 供本地开发用，所以默认开着；一旦要放到别人能访问的地方，
#  先把 management-enabled 改成 false（那时整族端点直接 404），再接登录链路。
# ------------------------------------------------------------

# 管理端点是否可用。false 时 /api/permissions/** 整族 404（不是 403：一个"不能改"的
# 只读界面会让人以为功能坏了，而真相是这个功能在这台机器上被关掉了）
ai.agent.permission.management-enabled=true

# 库里一个账号都没有时，启动补一个初始管理员（角色「管理员」= 全部工具）。
# 【为什么默认开】不开的话，权限页第一次打开是一张空表，而"怎么建第一个账号"
# 只能靠手工 SQL —— 手工 SQL 没有校验（明文口令能插进去、工具名写错也不报错），
# 于是第一个账号往往就是最不规范的那一个。
ai.agent.permission.bootstrap-enabled=true
ai.agent.permission.bootstrap-admin-name=admin
# 初始口令。**留空 = 不建账号**（那时启动日志会明确说"不建初始账号"）。
# 建完之后请立刻在界面上改掉：它是权限最宽的账号，而这个值是明文写在配置里的。
# 上生产时这一行应当删掉，改成由人显式建号。
ai.agent.permission.bootstrap-admin-password=admin123
# 初始管理员的目录前缀（工作区范围）。**留空 = 不给目录授权**，而不是默认成 "."
# —— 默认成进程工作目录会把"范围取决于从哪儿启动"写进库，换个目录重启它就永远命中不了。
#
# ⚠️ 反斜杠必须写成 `\\`：`.properties` 里 `\` 是转义符，写成单斜杠时
#    这个值会被**静默**解析成 `C:UsersljfDesktopai agent`（实测：用 Properties 读回来就是这么一串），
#    而它看起来仍像一个路径 —— 直到有人的工作区永远命中不了这个前缀。
#    判定按路径分段比，所以这个目录下的子目录都算命中；它是**授权范围**，
#    不是"只能在这个目录跑"（别的目录只会判成没有权限，而不是报错）。
# ⚠️ 改这一行只影响**建库那一次**（库里已经有账号时引导程序完全不动作）。
#    已经建好的角色要在界面上改（权限管理 → 角色 → 目录），或者删掉那几行重来。
ai.agent.permission.bootstrap-dir-prefix=C:\\Users\\ljf\\Desktop\\ai agent

# ------------------------------------------------------------
#  审查工单（本项目选定的"外部系统"）
#  代码见 ai.agent.service.review.* + ai.agent.service.impl.tool.ProposeReviewTool
#
#  【它为什么必须存在】因为 HITL 卡在这里：
#  「⚠️ 现在**三把工具全是只读的，这条没有真实场景可验证**：
#  要做出可信的样子，必须先有至少一个『写』工具。」
#  一个只读工具走审批，断言得再漂亮，也回答不了真正需要回答的问题：
#  **"人拒绝之后，那个副作用真的没发生吗？"** —— 那需要有一个副作用能被观察到。
# ------------------------------------------------------------

# 工单落盘位置。**与 Agent 运行库分开**是刻意的：工单是业务数据、运行记录是过程数据，
# 两者的保留策略与清理时机完全不同（清掉过程记录不该顺手清掉业务数据）。
ai.review.ticket-file=./data/review-tickets.jsonl

# ============================================================
#  agent 任务执行（定时任务）
#  代码见 ai.agent.service.task.AgentTaskScheduler（调度与执行锁）
#        + DefaultAgentTaskExecution（每一步做什么）
#        + AgentTaskAnalyst / ModelAgentTaskAnalyst（判定：需求歧义 / 拆任务点）
#  配置绑定在 ai.agent.config.AgentTaskProperties（**五个键都必须写在这里**）
#
#  【它做什么】把「新发布 / 已确认需求 / 已确认计划 / 已授权」这四格往前推：
#    新发布       → 判断需求描述有没有歧义：有 → 待确认需求（生成需求确认项）；没有 → 已确认需求
#    已确认需求   → 再判一次歧义；没有就拆任务点：≥ 阈值 → 待确认计划；否则 → 待授权
#    已确认计划   → 判断授权范围 → 待授权（生成授权确认项）
#    已授权       → 跑一次 Agent 运行 → 待验收（写执行结果：产出 / 改动 / 运行统计）
#  也就是说：这一页上原来由人点的「发起需求确认」「登记执行结果」，现在由它做
#  （「登记执行结果」保留为人手兜底：执行没跑完时用它把任务推到待验收）。
#
#  【两个触发源】记录一更新就调度一次（已完成 / 已取消除外），外加下面这个周期兜底。
#  执行是**串行**的：一个执行锁 + 一次取一条（按 update_time 从早到晚）。
#  ⚠️ 锁只在**本进程内**有效：多实例部署时同一条任务会被两个进程各跑一遍。
#     那属于重复副作用，不是"多花一次钱"，见 AgentTaskScheduler 的类注释。
# ============================================================

# 总开关。关掉时定时触发与"记录更新即调度"都不执行任何任务，
# 任务照常留在原状态（卡片停在原列，不会假装在跑）
ai.agent.task.enabled=true

# 【本应用在 Agent 应用注册表里的 id】平台第一次接手一条任务时，把它写进 agent_task.agent_id。
# 发布人不填这一列（发布请求体里没有 agentId）：它回答的是"这条任务交给哪个 Agent 应用"，
# 而那是部署方才知道的东西 —— 让发布人打一个 id，等于把"这个 id 对不对"变成一个人的记忆。
# ⚠️ 它是**字符串**（那一列是 VARCHAR(128)：应用 id 由那张注册表定义，本仓不假设它长得像数字），
#    注册表在另一个业务域里（见 db/task-schema.sql 的注释），本仓不校验这个 id 存不存在；
#    只校验填了没有、有没有超过列宽 —— 留空或超长会在启动时被 AgentTaskProperties 拒掉
#    （留空会写成 agent#，而按它反查 Agent 应用永远查不到）
ai.agent.task.agent-id=1

# 定时触发间隔（兜底周期）。10 分钟的依据：它远长于一次判定的耗时（秒级），
# 于是"兜底"不会与"记录更新即调度"抢同一批任务；又短到"调度漏掉的那些"当天就能被捞回来。
# 它是 fixedDelay（上一次结束之后计时），不是 fixedRate —— 执行时间超过周期时不会连着触发
ai.agent.task.fixed-delay=10m

# 一轮调度最多处理几条任务。它是**防打转**的上限：正常情况下每条任务在一轮里
# 最多往前走两格就不在"等 agent"那几格里了 —— 撞到这个数说明有东西在反复变回待处理，
# 所以撞上时会留一行 WARN（不静默截断）
ai.agent.task.max-tasks-per-round=20

# 拆出来的任务点达到几个就**要人确认计划**。5 的依据是"人一次能看清的清单长度"：
# 少于这个数，逐个点一遍比读一份计划再点头更省事（那条路直接去问授权）
ai.agent.task.plan-confirm-threshold=5

# 执行时用的权限档位（枚举名或中文标签）。**默认是完全权限，理由不是方便**：
# 任务执行是无人值守的（跑它的是调度线程，没有人在页面前），
# 而另外两档下每一次写操作都会停下来等人点头，然后按 120 秒超时按拒绝处理 ——
# 也就是说默认值不是"更安全"，而是"每一条要改文件的任务都必然失败"。
# 它不绕过任何人的决定：任务在开跑前已经过了一格「待授权」，那格的答复就是这次执行的授权。
# 要更严就改成 WORKSPACE_WRITE / READ_ONLY，并接受写操作会停下来等人
ai.agent.task.permission-level=FULL_ACCESS


# ------------------------------------------------------------
#  技能（skill）进提示词与进工具的两个上限
#  代码见 ai.agent.config.SkillPromptProperties
#        + ai.agent.service.skill.SkillDirectory（执行者 → 角色 → 目录 → 技能）
#        + ai.agent.service.impl.tool.GetSkillContentTool（按名字取正文）
#
#  【它解决什么】库里那张 agent_skill 表原先只是配置（有人写、没人读）：
#  运行期没有任何调用方读它，所以"技能对模型行为的影响"是 0。
#  现在每次运行按**执行者的角色目录**筛出这个目录下的技能，
#  把 name + description 拼进系统提示词，正文由模型按需用 get_skill_content 取回来。
#
#  【两个上限为什么必须存在】技能目录拼进的是**每一轮模型往返都要付一遍**的系统提示词。
#  一个目录下堆了几百条时，没有上限的后果不是"崩"，而是每次运行先花掉几万 token
#  读一份用不上的目录，同时把真正有用的上下文挤出去 —— 所以上限防的是"答错"。
#  超限时截断，并且**截断这件事会写进提示词**（静默截断会让模型以为"目录里就这些"）。
# ------------------------------------------------------------

# 系统提示词里最多列几条技能的 name + desc。
# 50 的依据：每条约 60~120 字符（名字 + 一句说明），50 条约 3~6 千字符 ——
# 与一次检索回填（约 2000 字符）同量级而略大，再大就会让提示词本身变成主要成本。
# 注意它**不影响** get_skill_content：那个按名字取，不受这个条数限制
# （被截断掉的那些技能在提示词里看不到名字，所以模型也不会去取它们）。
ai.agent.skill.max-catalog-skills=50

# get_skill_content 单次返回的正文上限。6000 字符的依据：容得下一份完整的操作手册，
# 又明显低于"一次工具调用就把上下文顶满"的量级；正文比它长说明这条技能该拆成几条，
# 而工具会把这个判断与"还有多少没显示"一起写进回填文本。
ai.agent.skill.max-content-chars=6000


# 幂等窗口：同一个"标题 + 级别"在此时长内只建一条工单。
# 它是"重复副作用"的**第二道防线**（第一道是 HITL 闸门）。
# 【为什么默认 10 分钟这么长】写操作重复的典型成因是"模型重提 + 人又批了一次"，
# 而这两件事之间的间隔是**人的反应时间**，不是毫秒级。窗口设成几秒等于没设。
ai.review.deduplication-window=10m

# 详情入库前的截断上限。超限时**显式说明被截断**（与本项目其他所有截断同一条规则：
# 一段被砍掉尾巴的文本看起来完全正常，而人据此批准的决定针对的不是真正会执行的那份）
ai.review.max-detail-chars=1000

# ============================================================
#  MCP Server —— 把工具暴露给外部 MCP 客户端（阶段三第 10 件）
#  本项目「最大亮点」
#
#  【这一步的前置检查，本项目专门警告过】
#  「⚠️ 先确认 MCP 的 Java 依赖在离线仓库里拿得到」——
#  H2 那次因为"BOM 指定的版本本地没有"踩过一次（见 pom 里 h2.version 的注释）。
#  所以本依赖是先实测 `mvn dependency:get` 成功、并确认
#  `io.modelcontextprotocol.sdk:mcp-core:2.0.0` 与 `mcp-json-jackson3:2.0.0`
#  已经进入本地仓库之后才写进 pom 的。
#
#  【⚠️ 下面这一行是本模块最重要的一行配置：删掉它不会报错，但会埋一个雷】
#  ToolCallbackConverterAutoConfiguration 会**收集容器里全部的 ToolCallback bean**
#  并把它们注册成 MCP 工具。而本项目的 AgentTool 既是 ToolCallback 又是 bean
#  （那是有意的设计：直接实现 Spring AI 真 SPI），同时它的 call(String)
#  **被故意实现成抛异常**（那是为了堵死"绕过校验的第二条执行路径"）。
#  两者相撞的后果：MCP 的 tools/list 正常列出工具，只有 tools/call 才炸 ——
#  一个**只在第一次真正被使用时才暴露**的失败。
#  排除之后，对外暴露哪些工具由 McpExposureConfig 显式决定（只暴露只读的）。
#  启动时还有一道自检会去问服务器"你现在装了哪些工具"并断言一致
#  （因为"排除一个不存在的类"Spring 是不报错的，光靠配置证明不了它生效）。
# ------------------------------------------------------------
spring.autoconfigure.exclude=\
  org.springframework.ai.mcp.server.common.autoconfigure.ToolCallbackConverterAutoConfiguration

# MCP Server 总开关
spring.ai.mcp.server.enabled=true

# 本服务器对外自报的名字与版本（客户端连接时会看到）
spring.ai.mcp.server.name=ai-agent-tools
spring.ai.mcp.server.version=0.0.1

# 传输方式（**这一行漏了就是 404，而且不会报错**）
# `type` 管的是服务端 API 形态（SYNC/ASYNC），`protocol` 管的是**传输协议**
# （SSE / STREAMABLE / STATELESS）—— 两个是不同的维度，名字很像。
# ⚠️ 实测踩过：只写了 type=SYNC 而没写 protocol 时，应用能正常启动、
# 日志里说 "Registered tools: 3"、`McpSyncServer` 也确实存在（启动自检能跑通），
# **但 `/mcp` 端点返回 404** —— 因为 streamable 的那个 WebMvc 自动配置
# 带着一个 `EnabledStreamableServerCondition`，它要求 protocol == STREAMABLE。
# 也就是说："工具注册好了"与"端点存在"是两件事，而只有前者会在启动日志里说话。
# 这正是「装上了」与「真在生效」是两件事的形状（"装上了"与"能用"是两件事），
# 所以 scripts/verify-mcp.ps1 才必须真的发一次 HTTP 请求 —— 光看启动日志会得出错误结论。
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC

# 对外说明。客户端连上来时能看到它 —— 这句是**给对方的模型读的**，
# 所以写"这里有什么、没有什么"，而不是"欢迎使用"。
# 特别写明"写操作不对外"：否则对方的模型会去找一个不存在的建单工具，然后开始编。
spring.ai.mcp.server.instructions=本服务器提供项目技术文档库的只读检索能力：search_docs（关键词检索，返回最相关的片段）、list_documents（列出知识库里的文档）、read_section（读取某一节的完整正文）、query_sql（对项目自己的运行库执行只读 SQL）。写操作（例如创建审查工单）刻意不对外开放 —— 它只能由本应用自己的模型链路发起，并经过人工确认。如果你需要写操作，请把请求转达给人，由人在本应用的界面上确认。

# Streamable HTTP 的端点路径。显式写出来而不是靠默认值：
# 端点是**对外契约**，它不该随某个依赖的默认值变化而变化
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# 保持连接的心跳间隔
spring.ai.mcp.server.streamable-http.keep-alive-interval=30s

# ============================================================
#  成本看板（阶段四 · 工程化）
#  代码见 ai.agent.service.cost.*（CostPricing / CostQuery / CostDashboardView / CostController）
#
#  【这一节要回答的三个问题】
#    ① 花了多少（按天走势）；② 谁花的（按业务归因键 / 按模型）；③ 花得值不值
#    （失败的运行同样花钱、缓存命中率、工具调用与延迟）。
#  第三问是它与"账单截图"的区别：账单只知道花了多少，
#  而"花了钱又没办成事"只在我们自己的数据里才有。
#
#  【token 与钱是两类东西，这一节只配后者】
#  token 数来自上游响应里的 usage，应用侧只做聚合 —— 所以它**不需要任何配置**，
#  也永远与上游账单是同一份事实。钱 = token × 单价，而单价是**外部世界的商业条款**：
#  会变、按模型不同、还可能因为谈了个折扣而不一样。
#  所以这里**刻意不写死任何默认价格**，价格缺失时看板显示「未配置」+ 待配模型清单，
#  而不是 ¥0.00 —— 一个 0 会被读成「这个功能不花钱」，
#  而真相是「我们不知道它花多少钱」。这两句话对使用者的含义完全相反。
#
#  【怎么配：抄下面这段，把数字换成你自己的合同价】
#    ai.cost.currency=CNY
#    ai.cost.prices[0].model=deepseek-flash
#    ai.cost.prices[0].input-per-million=1
#    ai.cost.prices[0].cache-hit-per-million=0.02
#    ai.cost.prices[0].output-per-million=4
#    ai.cost.prices[0].currency=CNY
#    ai.cost.prices[0].effective-from=2026-01-01
#    ai.cost.prices[0].source=供应商定价页（写清出处：调价之后要能回答「这个价哪来的」）
#  模型名用 * 表示兜底规则（但**没有模型名的运行永远不会走兜底规则** ——
#  上游漏报模型名时，用别的模型的价去顶会得出一个长得完全一样的假金额）。
#
#  【调价怎么办：新增一条，不要改旧的那条】
#  每条价格带 effective-from，看板按**运行发生的时刻**选当时生效的那条。
#  改旧规则会把历史成本一起按新价改写，而那种改写不留任何痕迹。
#
#  【为什么缓存价要单独一档】
#  缓存命中与未命中的价差是数量级级的（供应商口径常见 50 倍）。
#  不写它的后果不是报错，而是成本**稳定高估**，且高估的倍数随上游缓存命中率浮动 ——
#  一个我们既看不见也调不了的量。不写 cache-hit 时按未命中价算（偏保守），
#  看板上会把这一档标成「假设」而不是「事实」。
# ============================================================
ai.cost.currency=CNY
ai.cost.prices[0].model=deepseek-flash
ai.cost.prices[0].input-per-million=1
ai.cost.prices[0].cache-hit-per-million=0.02
ai.cost.prices[0].output-per-million=4
ai.cost.prices[0].currency=CNY
ai.cost.prices[0].effective-from=2026-01-01
ai.cost.prices[0].source=https://api-docs.deepseek.com/zh-cn/quick_start/pricing

# ============================================================
#  异常告警（阶段四 · 工程化第 5 件）
#
#  【判据不在这里配，这是刻意的】
#  「什么算异常」写在 AlertRule 枚举里（阈值、方向、严重度、处置说明四样在一起）。
#  为什么不放成配置项：一个**能被调低**的阈值会在"告警响了但没人管"的时候
#  被顺手调低，而那一刻它就不再是判据了 —— 它变成了"让页面变绿"的开关。
#  改判据要走代码改动 + 测试，那才是判据该有的成本。
#
#  【通知通道现在只有日志】
#  这是刻意的取舍：webhook / 邮件需要凭据、重试策略、以及"发了但没收到怎么办"，
#  那些是运维接入的事，不是这一件的核心命题。通知点集中在 AlertRecorder.notify
#  一个方法里，接 webhook 时只改那一处。
# ============================================================

# 写操作的令牌（确认告警）。空 = 不校验（本地开发），但响应里会明确标注
# writeProtected=false —— 让"忘了配"变成界面上一行看得见的字，而不是一个隐性漏洞。
# ⚠️ /api/alerts/sweep?dryRun=true 是纯读的（只算不写），不受它约束。
ai.alert.write-token=

# ============================================================
#  灰度发布（阶段四 · 工程化第 5 件）
#
#  【没有配置项，只有数据】
#  一次灰度是"某个候选版本放多少量"，它是**运行时状态**而不是部署配置 ——
#  所以它存在 prompt_canary 表里（随 ai.agent.store.url 一起，默认是内存库，
#  重启即清空）。用 POST /api/canary/start 开，POST /api/canary/stop 停。
#
#  【为什么不存在配置文件里，而要落库】
#  因为"当时配了多少重量、为什么停"必须与那些运行一起被留住。
#  放配置里的话，改一次配置就把上一次实验的证据改了 ——
#  而"两组对比"的前提正是"当时是这么分的"。
#
#  【分流怎么算：运行 id 的稳定哈希，不存映射表】
#  见 CanaryService.decide 的注释。代价说清了：分桶函数改了之后，
#  新运行的分布会变，而**已经跑过的那批属于哪一组不会跟着变**（那是历史）——
#  所以真实分组落在了 agent_step.canary_variant 里，报告读的是那个字段。
# ============================================================
