# ============================================================================
#  回归门禁（阶段四第 4 件：评测接入 CI）
#
#  这个文件只做一件事：把 `node scripts/ci.mjs` 放到 CI 上跑。
#  它**刻意不重新编排**门禁 —— 编排逻辑只有一份（在 scripts/ci.mjs 里），
#  否则本地跑的与 CI 跑的就会慢慢变成两条不同的链路，
#  而"本地全绿、CI 红了"会变成一件需要专门排查的事（那正是门禁失效的开始）。
#
#  ⚠️ 这一轮它跟着 ci.mjs 一起变了：**后端测试已整体删除**（含 `RagRegressionTest`
#  与 `rag-baseline.json`），所以原来那个"核心门禁"job（JDK 21 + Maven 预热 +
#  `node scripts/ci.mjs`）已经没有东西可跑，整块删掉了 —— 后端现在**不在 CI 里构建或测试**。
#  剩下的一道门禁是**界面自检（假后端，连跑两遍）**：它不需要 JDK、不需要 Maven
#  （假后端是一个纯 node 的 sse-server），但需要 **Playwright + 一个浏览器内核**（见下）。
#
#  ⚠️ 诚实声明：**这个 workflow 从未在 GitHub 的 runner 上跑过。**
#  本仓库当前没有配置 git remote（`git remote -v` 为空），所以它无从验证。
#  能保证的是：它调用的每条命令都在本机真跑过（`node scripts/ci.mjs` 全绿），
#  且 YAML 语法有效。不能保证的是 runner 环境特有的那些事 ——
#  这个 job 不需要 JDK / Maven，要盯的是 Playwright 的依赖安装与浏览器内核
#  （见下面 steps 里的注释，以及 `web/README.md`「界面自检」一节）。
# ============================================================================

name: regression

# ⚠️ `on:` 这里加了引号，不是风格问题，是一个实测踩到的解析陷阱。
#
# YAML 1.1 把裸写的 `on` 当成**布尔真**（与 `yes` / `true` 同义）—— 实测用 snakeyaml 1.17
# 解析这个文件时，顶层键读出来是 `[name, true, jobs]`，`on:` 整个变成了 `true: null`。
# GitHub Actions 自己用的是 YAML 1.2 语义（`on` 是普通字符串），所以**裸写也能正常工作** ——
# 但"能工作"依赖的是"解析器恰好按 1.2 读"，而任何拿 1.1 语义的工具（CI 检查器、
# IDE 插件、pre-commit 钩子）都会把它读成 `true`，于是**校验工具与 GitHub 看到的是两份不同的文件**。
# 加引号让两种语义下都是字符串，消除这个不确定性 —— 代价是两个字符。
"on":
  push:
    branches: [master, main]
  pull_request:
  # 手动触发：改完 Prompt 想单独跑一遍回归时用这个。
  # ⚠️ 说清它的边界：**Prompt 不在 git 里**（它存在版本库里），所以
  # "改一次 Prompt 自动跑一遍回归"这件事无法靠 push 触发 ——
  # 只能由人在改完之后手工点一次。这不是偷懒，是这一层的事实：
  # 一个不在版本控制里的东西，触发不了以版本控制为信号的流水线。
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  #  唯一的一道门禁：界面自检（假后端，连跑两遍验确定性）
  #
  #  为什么单独成 job 而不是塞进别的流程：它需要浏览器内核，
  #  而浏览器是这一层**唯一的外部依赖**。分清楚之后，
  #  "内核装不上"与"代码坏了"不会混成一句话。
  #
  #  真后端那一条路径（`--with-real-ui`）**刻意不在 CI 里跑**：
  #  它要求 8080 上已经跑着一个 Spring 后端（要 key、要等启动），
  #  那是另一件事。ci.mjs 会把"这一条没跑"打印出来。
  # --------------------------------------------------------------------------
  ui:
    name: 界面自检（假后端，跑两遍）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 界面自检只用到 web/ 的依赖（vite + playwright）。它不起 Spring 后端
      # （假后端是一个纯 node 的 sse-server），所以这里不需要 JDK，也不需要 Maven。
      - name: 装前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      # 【为什么必须装 chromium 内核，以及为什么下面要传 CHECK_BROWSER_CHANNEL】
      # verify-ui.mjs 默认用**系统 Chrome**（channel: 'chrome'）——
      # 那是为本机开发写的：开发者机器上有 Chrome，而 Playwright 自带内核不一定装过。
      # runner 上没有 Chrome，所以这里装 Playwright 的内核，并把频道切成 chromium
      # （见 web/README.md「用哪个浏览器内核」那一节）。
      # ⚠️ 不设那个环境变量的话，它会去找系统 Chrome，报
      # `Executable doesn't exist` —— 一个看起来像"界面坏了"的环境问题。
      - name: 装 Playwright 内核（含系统依赖）
        working-directory: web
        run: npx playwright install --with-deps chromium

      # ⚠️ 这一行**不带参数**：ci.mjs 的默认行为这一轮改成了"界面自检（假后端，跑两遍）"
      # （旧版默认只跑后端测试、界面要显式 `--with-ui`）。写成 `--with-ui` 也完全一样，
      # 但用默认写法能让"CI 跑的就是本地不加参数跑的那一条"一眼可见。
      - name: 界面门禁（假后端，连跑两遍验确定性）
        env:
          CHECK_BROWSER_CHANNEL: chromium
        run: node scripts/ci.mjs

      - name: 收产物（失败时尤其要看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          # 门禁的完整输出（stdout+stderr 合一份，中文失败原因在里面）与界面自检的
          # 截图/页面转储都要收：失败之后人往往只拿得到产物包，输出不落文件就没有证据
          path: |
            ci-logs/
            web/ui-check-out/
          if-no-files-found: warn
