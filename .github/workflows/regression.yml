# ============================================================================
#  回归门禁（阶段四第 4 件：评测接入 CI）
#
#  这个文件只做一件事：把 `node scripts/ci.mjs` 放到 CI 上跑。
#  它**刻意不重新编排**那几道门禁 —— 编排逻辑只有一份（在 scripts/ci.mjs 里），
#  否则本地跑的与 CI 跑的就会慢慢变成两条不同的链路，
#  而"本地全绿、CI 红了"会变成一件需要专门排查的事（那正是门禁失效的开始）。
#
#  ⚠️ 诚实声明：**这个 workflow 从未在 GitHub 的 runner 上跑过。**
#  本仓库当前没有配置 git remote（`git remote -v` 为空），所以它无从验证。
#  能保证的是：它调用的每条命令都在本机真跑过（`node scripts/ci.mjs --with-ui` 全绿），
#  且 YAML 语法有效。不能保证的是 runner 环境特有的那些事（见 docs/CI回归门禁.md
#  「首次接入要盯什么」那一节）。
# ============================================================================

name: regression

# ⚠️ `on:` 这里加了引号，不是风格问题，是一个实测踩到的解析陷阱。
#
# YAML 1.1 把裸写的 `on` 当成**布尔真**（与 `yes` / `true` 同义）—— 实测用 snakeyaml 1.17
# 解析这个文件时，顶层键读出来是 `[name, true, jobs]`，`on:` 整个变成了 `true: null`。
# GitHub Actions 自己用的是 YAML 1.2 语义（`on` 是普通字符串），所以**裸写也能正常工作** ——
# 但"能工作"依赖的是"解析器恰好按 1.2 读"，而任何拿 1.1 语义的工具（CI 检查器、
# IDE 插件、pre-commit 钩子）都会把它读成 `true`，于是**校验工具与 GitHub 看到的是两份不同的文件**。
# 加引号让两种语义下都是字符串，消除这个不确定性 —— 代价是两个字符。
"on":
  push:
    branches: [master, main]
  pull_request:
  # 手动触发：改完 Prompt 想单独跑一遍回归时用这个。
  # ⚠️ 说清它的边界：**Prompt 不在 git 里**（它存在版本库里），所以
  # "改一次 Prompt 自动跑一遍回归"这件事无法靠 push 触发 ——
  # 只能由人在改完之后手工点一次。这不是偷懒，是这一层的事实：
  # 一个不在版本控制里的东西，触发不了以版本控制为信号的流水线。
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  #  Job 1：核心门禁（必跑）
  #
  #  与平台无关的那一条路：JDK 21 + Maven + Node，**不需要浏览器、不需要网络**
  #  （Maven 用 -o）。所以它跑得快、失败只指向代码。
  # --------------------------------------------------------------------------
  gates:
    name: 后端测试 + 离线评测回归基线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # 缓存 ~/.m2：下面用 -o 跑，本地仓库必须已经有依赖。
          # 缓存键跟着 pom.xml 走，pom 一变就重新预热
          cache: maven

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 【预热本地仓库 —— 这一步的存在理由要说清】
      # scripts/ci.mjs 里 Maven 一律带 `-o`（离线）。那是刻意的：
      # 联网解析会引入一个**与代码无关的失败源**（镜像抽风、网络抖动），
      # 而门禁的失败必须只指向代码。
      # 但"离线"的前提是本地仓库里已经有依赖 —— 第一次跑（或缓存失效）时必须先拉一次。
      # 所以这里联网预热，然后真正的门禁用离线跑。
      - name: 预热 Maven 本地仓库（离线门禁的前提）
        working-directory: ai-agent
        # `dependency:go-offline` 只保证"解析得到"，不保证"测试期要用的插件都下全了"，
        # 所以额外跑一次 compile 把编译期插件也带下来。允许失败：
        # 预热不成功时下面的门禁会以它自己的方式报错（信息更准确），
        # 而这里失败会让"到底是预热挂了还是代码挂了"变得分不清
        continue-on-error: true
        run: |
          mvn -B -q dependency:go-offline
          mvn -B -q compile -DskipTests

      - name: 核心门禁
        # 只用 Node 起编排，不经过 pnpm/mvn 的包装脚本 —— 少一层就少一个环境差异
        run: node scripts/ci.mjs

      - name: 收产物（失败时尤其要看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-core
          # 报告与实测值**必须收**：失败原因（中文）在于此，
          # 而终端日志的编码会跟随 runner 的 locale —— 落成文件才是可靠的那一份
          path: |
            ci-logs/
            ai-agent/target/rag-regression-report.txt
            ai-agent/target/rag-actual.json
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  #  Job 2：界面门禁（假后端）
  #
  #  单独一个 job，因为它需要浏览器 —— 而浏览器是这一层唯一的外部依赖。
  #  分开之后：浏览器装不上只会让这个 job 红，核心门禁的结论不受影响
  #  （粘在一起的话，一个 Playwright 的下载失败会让你看不出代码到底有没有问题）。
  # --------------------------------------------------------------------------
  ui:
    name: 界面自检（假后端，跑两遍）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 界面自检只用到 web/ 的依赖（vite + playwright）。它不起 Spring 后端
      # （假后端是一个纯 node 的 sse-server），所以这里不需要 Maven。
      - name: 装前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      # 【为什么必须装 chromium 内核，以及为什么下面要传 CHECK_BROWSER_CHANNEL】
      # verify-ui.mjs 默认用**系统 Chrome**（channel: 'chrome'）——
      # 那是为本机开发写的：开发者机器上有 Chrome，而 Playwright 自带内核的版本
      # 可能对不上（本机就踩过，见踩坑库 #25）。
      # runner 上没有 Chrome，所以这里装 playwright 的内核，并把频道切成 chromium。
      # ⚠️ 不设那个环境变量的话，它会去找系统 Chrome，报
      # `Executable doesn't exist` —— 一个看起来像"界面坏了"的环境问题。
      - name: 装 Playwright 内核（含系统依赖）
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: 界面门禁（假后端，连跑两遍验确定性）
        env:
          CHECK_BROWSER_CHANNEL: chromium
        run: node scripts/ci.mjs --with-ui

      - name: 收产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-ui
          path: |
            ci-logs/
            web/ui-check-out/
          if-no-files-found: warn
